name: dascade
description: A lightweight immediate-mode TUI framework for Dart with buffered & differential rendering and ANSI styling.
version: 0.0.1-dev.1
repository: https://github.com/iwilkey/dascade.git
issue_tracker: https://github.com/iwilkey/dascade/issues

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  # the only dependency, and let's keep it that way!
  dart_console: ^4.1.2

dev_dependencies:
  build_runner: ^2.10.5
  build_web_compilers: any
  lints: ^6.0.0
  test: ^1.25.6
